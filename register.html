<!-- =========================
     Register Section
========================= -->


<section class="section">


<div class="container">



<div class="form-box">


<h2>
Create Account
</h2>





<form id="registerForm">





<div class="form-group">


<label>
Full Name
</label>


<input type="text"
id="name"
placeholder="Enter your name"
required>


</div>







<div class="form-group">


<label>
Email Address
</label>


<input type="email"
id="email"
placeholder="Enter your email"
required>


</div>







<div class="form-group">


<label>
Mobile Number
</label>


<input type="number"
id="mobile"
placeholder="Enter mobile number"
required>


</div>







<div class="form-group">


<label>
Password
</label>


<input type="password"
id="password"
placeholder="Create password"
required>


</div>







<div class="form-group">


<label>
Confirm Password
</label>


<input type="password"
id="confirmPassword"
placeholder="Confirm password"
required>


</div>







<button type="submit" class="btn">

Register

</button>






<p style="margin-top:20px;text-align:center;">


Already have an account?

<a href="login.html" style="color:#0d47a1;font-weight:600;">

Login Here

</a>


</p>





</form>


</div>



</div>
